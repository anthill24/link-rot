name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Tests mock all HTTP — no live network is used.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - name: Dogfood — offline self-check of the repo's own docs
        # Offline: validates relative paths + anchors only, never the network.
        run: node dist/cli.js check "**/*.md" --offline
