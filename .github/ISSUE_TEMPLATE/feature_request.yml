name: Feature request
description: Suggest an idea or improvement for link-rot
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like link-rot to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
